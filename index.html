<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplikasi kalkulator sederhana menggunakan HTML, CSS, dan JavaScript.">
  <title>Kalkulator Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header>
      <p class="eyebrow">APLIKASI WEB</p>
      <h1>Kalkulator</h1>
      <p class="subtitle">Kalkulator sederhana untuk operasi aritmatika.</p>
    </header>

    <section class="display" aria-label="Layar kalkulator">
      <div id="history" class="history" aria-live="polite"></div>
      <output id="screen" class="screen" aria-live="polite">0</output>
    </section>

    <section class="keys" aria-label="Tombol kalkulator">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="delete">DEL</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="calculate">=</button>
    </section>
    <footer>HTML · CSS · JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
